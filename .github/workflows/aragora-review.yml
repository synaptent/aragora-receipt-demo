# Every pull request gets an Aragora multi-model review and a portable
# Open Decision Receipt (ODR). Two model families review each pull request:
# OpenAI directly and DeepSeek through OpenRouter. The review job uploads the
# receipt as a build artifact; the receipt-first-hour job then re-verifies it
# with the standalone `aragora-verify` package from PyPI, which shares no code
# path with the reviewer that produced it.

name: Aragora decision receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: aragora-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Review and emit receipt
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      # post-comment publishes the review with `gh pr comment`, which needs both.
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Aragora review
        id: review
        uses: synaptent/aragora@486a10d835be5da00df488b5bef6c1e708da8f10 # v2.11.1
        env:
          ARAGORA_ODR_PROFILE_VERSION: '0.2'
        with:
          agents: 'openai-api,openrouter'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          post-comment: 'true'
          emit-receipt: 'true'
          receipt-reviewers: 'openai deepseek'
          odr-signing-key: ${{ secrets.ARAGORA_ODR_SIGNING_KEY }}

      - name: Upload the decision receipt
        uses: actions/upload-artifact@v4
        with:
          name: decision-receipt-pr-${{ github.event.pull_request.number }}
          path: ${{ steps.review.outputs.receipt-path }}
          if-no-files-found: error

      # A second, independent anchor: GitHub records the digest at emission
      # time in the run summary.
      - name: Record the receipt digest in the run summary
        env:
          RECEIPT_DIGEST: ${{ steps.review.outputs.receipt-digest }}
          RECEIPT_VERDICT: ${{ steps.review.outputs.receipt-verdict }}
          RECEIPT_KEY_ID: ${{ steps.review.outputs.receipt-key-id }}
        run: |
          {
            echo "### Decision receipt"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Verdict | \`${RECEIPT_VERDICT}\` |"
            echo "| odr_digest | \`${RECEIPT_DIGEST}\` |"
            echo "| Signing key | \`${RECEIPT_KEY_ID}\` |"
            echo ""
            echo "Download the artifact and run \`aragora-verify decision-receipt.odr.json --pubkey odr-signing-key.pub.pem\` with the public key from this repository."
          } >> "$GITHUB_STEP_SUMMARY"

  receipt-first-hour:
    name: Verify the receipt with aragora-verify
    needs: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the decision receipt
        uses: actions/download-artifact@v4
        with:
          name: decision-receipt-pr-${{ github.event.pull_request.number }}
          path: receipt

      - name: Install aragora-verify from PyPI
        run: python -m pip install "aragora-verify>=0.2.0"

      - name: Verify the receipt against this repository's public key
        run: |
          receipt=$(find receipt -name '*.odr.json' -print -quit)
          if [ -z "$receipt" ]; then
            echo "::error::The decision-receipt artifact contains no .odr.json file"
            exit 1
          fi
          aragora-verify --version
          set +e
          aragora-verify "$receipt" --pubkey odr-signing-key.pub.pem
          rc=$?
          set -e
          echo "aragora-verify exit code: $rc"
          case "$rc" in
            0) echo "Accepted: exit 0, the signature, digest, schema and quorum checks passed." ;;
            3) echo "Accepted: exit 3, the receipt is structurally valid but its signature was not checked." ;;
            *)
              echo "::error::aragora-verify exited $rc; only 0 or 3 is accepted"
              exit 1
              ;;
          esac

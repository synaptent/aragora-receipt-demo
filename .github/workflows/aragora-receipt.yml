# Every pull request gets an Aragora multi-model review and a portable
# Open Decision Receipt (ODR). The receipt is uploaded as a build artifact and
# re-verified offline with the standalone `aragora-verify` package, which
# shares no code path with the reviewer that produced it.

name: Aragora decision receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: aragora-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review and emit receipt
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Run Aragora review
        id: review
        uses: synaptent/aragora@44ac78ad311785ecaa91b3fe56c7c7c613af92d9
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          post-comment: 'true'
          emit-receipt: 'true'
          receipt-reviewers: 'claude openai'
          odr-signing-key: ${{ secrets.ARAGORA_ODR_SIGNING_KEY }}

      - name: Fail if no receipt was produced
        if: steps.review.outputs.receipt-verified != 'true'
        run: |
          echo "::error::No verified decision receipt was produced. Check that the ANTHROPIC_API_KEY and OPENAI_API_KEY repository secrets are set."
          exit 1

      - name: Upload the decision receipt
        uses: actions/upload-artifact@v4
        with:
          name: decision-receipt-pr-${{ github.event.pull_request.number }}
          path: ${{ steps.review.outputs.receipt-path }}

      - name: Verify the receipt with the standalone verifier
        env:
          RECEIPT_PATH: ${{ steps.review.outputs.receipt-path }}
        run: |
          python3 -m pip install --quiet "aragora-verify>=0.2.0"
          # Checked against the public key committed in this repository, so any
          # edit to the receipt fails the signature check.
          aragora-verify "$RECEIPT_PATH" --pubkey odr-signing-key.pub.pem

      # A second, independent anchor: GitHub records the digest at emission
      # time in the run summary.
      - name: Record the receipt digest in the run summary
        env:
          RECEIPT_DIGEST: ${{ steps.review.outputs.receipt-digest }}
          RECEIPT_VERDICT: ${{ steps.review.outputs.receipt-verdict }}
          RECEIPT_KEY_ID: ${{ steps.review.outputs.receipt-key-id }}
        run: |
          {
            echo "### Decision receipt"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Verdict | \`${RECEIPT_VERDICT}\` |"
            echo "| odr_digest | \`${RECEIPT_DIGEST}\` |"
            echo "| Signing key | \`${RECEIPT_KEY_ID}\` |"
            echo ""
            echo "Download the artifact and run \`aragora-verify decision-receipt.odr.json --pubkey odr-signing-key.pub.pem\` with the public key from this repository."
          } >> "$GITHUB_STEP_SUMMARY"
